<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share your experience · SiteQuest Studio</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <style>
    body { background: var(--porcelain-2); }
    .rv { max-width: 620px; margin: 0 auto; padding: 64px 20px 80px; }
    .rv__card { background: #fff; border-radius: var(--r-l); padding: clamp(24px, 5vw, 44px); box-shadow: 0 30px 60px -40px rgba(8,38,37,.35); display: grid; gap: 22px; }
    .rv h1 { font-size: var(--step-3); line-height: 1; letter-spacing: -.03em; }
    .rv .lede { margin-top: 10px; font-size: var(--step-0); }
    .rv .logo { justify-self: start; }
    .stars { display: flex; gap: 6px; }
    .stars button { width: 48px; height: 48px; border: 0; background: none; padding: 0; color: var(--mist); transition: transform .3s var(--ease), color .2s; }
    .stars button svg { width: 100%; height: 100%; fill: currentColor; }
    .stars button.on { color: var(--pollen); }
    .stars button:hover { transform: scale(1.12) rotate(-6deg); }
    .rv .hint { font-size: .85rem; color: var(--ink-2); }
    .rv .prompts { display: flex; flex-wrap: wrap; gap: 6px; }
    .consent { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: var(--porcelain); cursor: pointer; }
    .consent input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--lagoon); flex: none; }
    .rv__acts { display: flex; flex-wrap: wrap; gap: 10px; }
    .rv__done { text-align: center; display: grid; gap: 14px; justify-items: center; }
    .rv__done blockquote { margin: 0; font-family: var(--f-display); font-size: var(--step-1); line-height: 1.3; }
    .err { color: #A3263F; font-size: 13px; }
  </style>
</head>
<body>
<main class="rv">
  <div class="rv__card" id="card">
    <a href="index.html" class="logo" aria-label="SiteQuest Studio home">
      <img class="logo__img" src="img/sitequest-logo.png" alt="SiteQuest" width="1200" height="241">
    </a>
    <div>
      <h1 id="title">How was working with us?</h1>
      <p class="lede">It takes about a minute. Your words help other small businesses decide, and we only publish them with your permission.</p>
    </div>
    <form id="form" novalidate style="display:grid;gap:22px">
      <fieldset class="field" style="border:0;padding:0;margin:0">
        <legend>Your rating</legend>
        <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>
        <span class="err" id="starErr" hidden>Tap a star to give a rating.</span>
      </fieldset>
      <div class="field">
        <label for="text">Your experience, in your own words</label>
        <textarea id="text" rows="5" placeholder="What was it like, and what changed for you?"></textarea>
        <span class="hint">Stuck? Tap a question to start:</span>
        <div class="prompts" id="prompts"></div>
        <span class="err" id="textErr" hidden>Write a sentence or two about your experience.</span>
      </div>
      <div class="field-row">
        <div class="field"><label for="name">Your name</label><input id="name" autocomplete="name"><span class="err" id="nameErr" hidden>Add your name.</span></div>
        <div class="field"><label for="role">Role and business</label><input id="role" placeholder="Founder, Mitama"></div>
      </div>
      <label class="consent"><input type="checkbox" id="ok"><span>You may show my review, name and business on your website.</span></label>
      <div class="rv__acts"><button class="btn" type="submit">Share my review</button></div>
    </form>
  </div>
</main>
<script>
  // ?client=mitama pre-fills the business; nothing is sent anywhere until the client chooses to.
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const clientName = { mitama: "Mitama", shecurity: "Shecurity", kindseed: "Kindseed" }[params.get("client")] || params.get("client") || "";
  if (clientName) { $("#title").textContent = `How was working with us on ${clientName}?`; $("#role").value = `Founder, ${clientName}`; }
  const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>`;
  let rating = 0;
  const drawStars = () => { $("#stars").innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" aria-checked="${n === rating}" aria-label="${n} star${n > 1 ? "s" : ""}" class="${n <= rating ? "on" : ""}" data-n="${n}">${STAR}</button>`).join(""); };
  drawStars();
  $("#stars").addEventListener("click", e => { const b = e.target.closest("[data-n]"); if (!b) return; rating = +b.dataset.n; drawStars(); $("#starErr").hidden = true; $(`[data-n="${rating}"]`).focus(); });
  const PROMPTS = ["What was it like to work with us?", "What do you like most about your site?", "What has changed since it went live?", "Would you recommend us, and to whom?"];
  $("#prompts").innerHTML = PROMPTS.map(p => `<button type="button" class="chip">${p}</button>`).join("");
  $("#prompts").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; const t = $("#text"); t.value = (t.value ? t.value + "\n\n" : "") + b.textContent + " "; t.focus(); });
  const esc = v => v.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const text = $("#text").value.trim(), name = $("#name").value.trim();
    // Remove any prompt questions the client didn't answer
    const clean = PROMPTS.reduce((t, p) => t.split(p).join(""), text).replace(/\n{3,}/g, "\n\n").replace(/^\s+|\s+$/g, "").replace(/[ \t]{2,}/g, " ");
    $("#starErr").hidden = !!rating; $("#textErr").hidden = clean.length > 10; $("#nameErr").hidden = !!name;
    if (!rating || clean.length <= 10 || !name) return;
    const review = { client: clientName, stars: rating, quote: clean, by: [name, $("#role").value.trim()].filter(Boolean).join(", "), mayPublish: $("#ok").checked, date: new Date().toISOString().slice(0, 10) };
    const asText = `Review for SiteQuest Studio\n\n${"★".repeat(review.stars)}${"☆".repeat(5 - review.stars)}\n\n“${review.quote}”\n— ${review.by}\n\nMay be published on the website: ${review.mayPublish ? "yes" : "no"}\nDate: ${review.date}`;
    $("#card").innerHTML = `<div class="rv__done">
      <div class="stars" aria-label="${review.stars} out of 5">${Array.from({ length: 5 }, (_, i) => `<button type="button" tabindex="-1" class="${i < review.stars ? "on" : ""}" style="width:34px;height:34px">${STAR}</button>`).join("")}</div>
      <blockquote>“${esc(review.quote)}”</blockquote><p class="hint">${esc(review.by)}</p>
      <h1 style="font-size:var(--step-2)">Thank you!</h1>
      <p class="lede" style="margin:0">Send your review back to us in the chat or email where you got this link.</p>
      <div class="rv__acts" style="justify-content:center"><button class="btn" type="button" id="copy">Copy my review</button><button class="btn btn--ghost" type="button" id="dl">Download it</button></div>
    </div>`;
    $("#copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(asText); $("#copy").textContent = "Copied"; } catch { $("#copy").textContent = "Copy failed, use Download"; } });
    $("#dl").addEventListener("click", () => {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([asText + "\n\n" + JSON.stringify(review, null, 2)], { type: "text/plain" }));
      a.download = `review-${(clientName || name).toLowerCase().replace(/[^a-z0-9]+/g, "-")}.txt`; a.click();
    });
  });
</script>
</body>
</html>
